# ==============================================================================
# RETAIL HIERARCHICAL DEMAND FORECASTER - MLOPS CONFIGURATION
# ==============================================================================

# Project Data & Artifact Paths
paths:
  raw_data_dir: "data/raw"
  processed_data_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  mlruns_dir: "mlruns"

# Preprocessing & History Window
preprocessing:
  start_day: 1069          # Start day index (recent ~2.5 years of high-relevance history)
  use_real_data: true

# Final Production Model Hyperparameters (LightGBM Tweedie)
model:
  objective: "tweedie"
  tweedie_variance_power: 1.15
  metric: "rmse"
  boosting_type: "gbdt"
  learning_rate: 0.1
  num_leaves: 45
  min_child_samples: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  n_estimators: 150
  random_state: 42
  n_jobs: 2                # CPU core limit
  num_threads: 2           # Worker thread limit
  verbose: -1

# Validation & Forecast Horizon
validation:
  val_days: 28             # 28-day forecasting horizon
  early_stopping_rounds: 25

# Operational Supply Chain & Inventory Settings
inventory:
  service_level: 0.95      # Target in-stock availability (95% service level -> Z = 1.645)
  lead_time_days: 7        # Supplier order replenishment lead time
